seed: 42

device: cpu

save_dir: ./checkpoints
save_interval: 1
exp_name: resshift_smoke

train:
  epochs: 1
  lr: 0.0002
  batch_size: 8

trainer_name: resshift

model:
  name: resshift
  params:
    in_channels: 2
    out_channels: 1
    model_channels: 32
    num_res_blocks: 1
    attention_resolutions: [7, 14]
    channel_mult: [1, 2]
    dropout: 0.0
    num_heads: 2
    image_size: 28

resshift:
  timesteps: 8
  schedule: geometric
  noise_level: 0.15
  shift_power: 0.3

data:
  task: super_resolution
  dataset: mnist
  root: ./data
  image_size: 28
  scale_factor: 2
  downsample_mode: bicubic
  upsample_mode: bicubic
  noise_std: 0.0
  value_range: zero_one
  max_train_samples: 32
  max_val_samples: 16
